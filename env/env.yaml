# Complete serial xgeo environment for users who clone the package.
# The author's .workspace/setup/mother.yaml is maintained separately.
name: xgeo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python>=3.14
  - pip

  # Analysis, plotting, and storage requirements
  - numpy
  - pandas
  - scipy
  - xarray
  - dask
  - distributed
  - cftime
  - netcdf4
  - cf_xarray
  - matplotlib
  - cartopy
  - seaborn
  - cmocean
  - pymannkendall
  - ipython
  - rich
  - scikit-image

  # Optional regridding and GRIB support, with native libraries from Conda
  - xesmf>=0.9.2
  - cfgrib
  - python-eccodes

  # External programs used by xgeo
  - cdo
  - nco
  - ffmpeg

  # Interactive use and development
  - jupyterlab
  - ipykernel<7
  - ipywidgets
  - ipympl
  - setuptools>=77
  - wheel
  - ruff
