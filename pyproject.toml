[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgeo"
version = "0.1.0"
description = "Geospatial analysis, plotting, and climate-data tools for xarray."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Jared M Kodero" }]
keywords = [
    "climate",
    "xarray",
    "netcdf",
    "cartopy",
    "atmospheric-science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Visualization",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
]

# MPI-distributed arrays and parallel I/O are packaged separately as xrmpi.
# This package uses the ordinary NetCDF backend for serial xarray I/O.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "dask[array,distributed]",
    "cftime",
    "netCDF4",
    "cf_xarray",
    "matplotlib",
    "cartopy",
    "seaborn",
    "cmocean",
    "pymannkendall",
    "ipython",
    "rich",
    "scikit-image",
]

[project.urls]
Homepage = "https://github.com/Jared-Kodero/xgeo"
Repository = "https://github.com/Jared-Kodero/xgeo"
Issues = "https://github.com/Jared-Kodero/xgeo/issues"
Documentation = "https://github.com/Jared-Kodero/xgeo#readme"

[project.optional-dependencies]
# xesmf is imported by regrid on first use; see env/env.yaml for Conda.
regrid = ["xesmf"]
# GRIB helpers are imported lazily and need the ecCodes bindings.
grib = ["cfgrib", "eccodes"]
dev = ["typing_extensions", "build", "twine", "pytest", "ruff"]

[tool.setuptools]
# This repository's root *is* the "xgeo" package: __init__.py sits
# next to this file, not inside a src/ subdirectory. package-dir maps the
# distribution's "xgeo" package to ".", the directory containing this
# file, rather than assuming a src-layout that does not exist here.
packages = [
    "xgeo",
    "xgeo.cdo",
    "xgeo.core",
    "xgeo.viz",
]
package-dir = { xgeo = "." }

[tool.setuptools.package-data]
"xgeo.core" = ["data/**/*"]
"xgeo.viz" = ["data/**/*"]

[tool.setuptools.exclude-package-data]
# Environment setup belongs to the source tree.
"*" = ["env/*", "__pycache__/*"]
